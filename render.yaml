services:
  - type: web
    name: spring-authorization-server-samples
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: docker.io/suayb/spring-authorization-server-samples:latest-native
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_LIQUIBASE_DROP_FIRST
        value: "true"
      - key: GRAFANA_CLOUD_OTLP_ENABLED
        value: "true"
      - key: GRAFANA_CLOUD_OTLP_AUTHORIZATION
        sync: false
      - key: GRAFANA_CLOUD_OTLP_METRICS_ENDPOINT
        sync: false
      - key: GRAFANA_CLOUD_OTLP_TRACES_ENDPOINT
        sync: false
      - key: GRAFANA_CLOUD_OTLP_LOGS_ENDPOINT
        sync: false
      - key: GRAFANA_CLOUD_TRACING_SAMPLING_PROBABILITY
        value: "1.0"
      - key: OTEL_SERVICE_NAME
        value: spring-authorization-server-samples
      - key: SERVER_PORT
        value: "10000"
      # Render prompts for these database values when the Blueprint is first created.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_AUTHORIZATION_SERVER_ISSUER
        value: https://spring-authorization-server-samples.onrender.com
