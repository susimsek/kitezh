services:
  - type: web
    name: kitezh
    runtime: image
    plan: free
    region: frankfurt
    autoDeploy: false
    image:
      url: docker.io/suayb/kitezh:latest
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_LIQUIBASE_DROP_FIRST
        value: "true"
      - key: MANAGEMENT_TRACING_EXPORT_ENABLED
        value: "false"
      - key: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
        value: "false"
      - key: MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
        value: "false"
      - key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
        value: "false"
      - key: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "1.0"
      - key: OTEL_SERVICE_NAME
        value: kitezh
      - key: SERVER_PORT
        value: "10000"
      # Render prompts for these database values when the Blueprint is first created.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_AUTHORIZATIONSERVER_ISSUER
        value: https://kitezh.onrender.com
      - key: APP_MCP_RESOURCE_AUDIENCE
        value: https://kitezh-mcp.onrender.com/mcp
      - key: GITHUB_API_TOKEN
        sync: false
  - type: web
    name: kitezh-mcp
    runtime: image
    plan: free
    region: frankfurt
    autoDeploy: false
    image:
      url: docker.io/suayb/kitezh-mcp:latest
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "10000"
      - key: OTEL_SERVICE_NAME
        value: kitezh-mcp
      - key: KITEZH_SECURITY_ISSUER_URI
        value: https://kitezh.onrender.com
      - key: KITEZH_SECURITY_AUDIENCE
        value: https://kitezh-mcp.onrender.com/mcp
      - key: KITEZH_API_BASE_URL
        value: https://kitezh.onrender.com
      - key: KITEZH_MCP_PUBLIC_URL
        value: https://kitezh-mcp.onrender.com/mcp
      - key: KITEZH_MCP_CLIENT_ID
        value: mcp-server
      - key: KITEZH_MCP_CLIENT_SECRET
        sync: false
      - key: KITEZH_READ_ONLY
        value: "true"
      - key: MANAGEMENT_TRACING_EXPORT_ENABLED
        value: "false"
      - key: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
        value: "false"
      - key: MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
        value: "false"
      - key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
        value: "false"
