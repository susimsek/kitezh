groups:
  - name: kitezh-mcp-production
    interval: 30s
    rules:
      # Spring Boot exports process uptime as either milliseconds or seconds,
      # depending on the exporter. Both series being absent means telemetry stopped.
      - alert: KitezhMcpTelemetryMissing
        expr: |
          absent_over_time(process_uptime_milliseconds{service_name="kitezh-mcp"}[5m])
          and absent_over_time(process_uptime_seconds{service_name="kitezh-mcp"}[5m])
        for: 2m
        labels:
          severity: critical
          service: kitezh-mcp
        annotations:
          summary: Kitezh MCP telemetry is missing
          description: No process uptime metrics for kitezh-mcp have arrived for at least five minutes.

      # kitezh_mcp_tool_calls_total uses status=success|client_error|upstream_error|internal_error.
      # These bounded labels intentionally exclude user, input, and resource identifiers.
      - alert: KitezhMcpToolErrorRate
        expr: |
          sum(rate(kitezh_mcp_tool_calls_total{service_name="kitezh-mcp",status=~"upstream_error|internal_error"}[5m]))
          / clamp_min(sum(rate(kitezh_mcp_tool_calls_total{service_name="kitezh-mcp"}[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
          service: kitezh-mcp
        annotations:
          summary: Kitezh MCP tool error rate is elevated
          description: Upstream and internal MCP tool errors have exceeded five percent of calls for five minutes.

      # kitezh_mcp_tool_call_duration_seconds is a histogram labeled by fixed tool name.
      - alert: KitezhMcpToolLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(kitezh_mcp_tool_call_duration_seconds_bucket{service_name="kitezh-mcp"}[5m]))) > 3
        for: 10m
        labels:
          severity: warning
          service: kitezh-mcp
        annotations:
          summary: Kitezh MCP tool latency is above target
          description: End-to-end tool call p95 latency has exceeded the three-second target for ten minutes.

      # kitezh_mcp_kitezh_api_requests_total uses fixed tool name and outcome=success|error.
      - alert: KitezhMcpDownstreamApiErrors
        expr: |
          sum(rate(kitezh_mcp_kitezh_api_requests_total{service_name="kitezh-mcp",outcome="error"}[5m]))
          / clamp_min(sum(rate(kitezh_mcp_kitezh_api_requests_total{service_name="kitezh-mcp"}[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
          service: kitezh-mcp
        annotations:
          summary: Kitezh MCP downstream API errors are elevated
          description: Kitezh API errors have exceeded five percent of MCP downstream requests for five minutes.

      # kitezh_mcp_kitezh_api_request_duration_seconds is a histogram labeled by fixed tool name.
      - alert: KitezhMcpDownstreamApiLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(kitezh_mcp_kitezh_api_request_duration_seconds_bucket{service_name="kitezh-mcp"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
          service: kitezh-mcp
        annotations:
          summary: Kitezh MCP downstream API latency is elevated
          description: Kitezh API request p95 latency has exceeded two seconds for ten minutes.

      # Spring Boot Micrometer default JVM memory gauges.
      - alert: KitezhMcpHighHeapUsage
        expr: |
          100 * sum(jvm_memory_used_bytes{service_name="kitezh-mcp",area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{service_name="kitezh-mcp",area="heap"}), 1) > 85
        for: 10m
        labels:
          severity: warning
          service: kitezh-mcp
        annotations:
          summary: Kitezh MCP JVM heap usage is high
          description: JVM heap usage has exceeded 85 percent for ten minutes.
