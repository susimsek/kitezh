server:
  shutdown: graceful

kitezh:
  mcp:
    allowed-origins: ${KITEZH_MCP_ALLOWED_ORIGINS:app://renderer,http://localhost:6274,http://127.0.0.1:6274}
    allow-local-hosts: ${KITEZH_MCP_ALLOW_LOCAL_HOSTS:false}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        kitezh_mcp_tool_call_duration_seconds: true
        kitezh_mcp_token_exchange_duration_seconds: true
        kitezh_mcp_kitezh_api_request_duration_seconds: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 250ms,1s,5s

logging:
  level:
    root: INFO
    io.github.susimsek.kitezh.mcp: INFO
