sonar.issue.ignore.multicriteria=S3437,S4502,S4684,S5145,UndocumentedApi,LocalizedPasswordLabels
# Rule https://rules.sonarsource.com/java/RSPEC-3437 is ignored, as a JPA-managed field cannot be transient.
sonar.issue.ignore.multicriteria.S3437.resourceKey=src/main/java/**/*
sonar.issue.ignore.multicriteria.S3437.ruleKey=squid:S3437
# Rule https://rules.sonarsource.com/java/RSPEC-4502 is ignored, as JWT bearer token APIs are not subject to CSRF.
sonar.issue.ignore.multicriteria.S4502.resourceKey=src/main/java/**/*
sonar.issue.ignore.multicriteria.S4502.ruleKey=java:S4502
# Rule https://rules.sonarsource.com/java/RSPEC-4684 is ignored for persistence and generated-style framework objects.
sonar.issue.ignore.multicriteria.S4684.resourceKey=src/main/java/**/*
sonar.issue.ignore.multicriteria.S4684.ruleKey=java:S4684
# Rule https://rules.sonarsource.com/java/RSPEC-5145 is ignored because security-sensitive framework responses are handled by Spring Security and Spring Authorization Server.
sonar.issue.ignore.multicriteria.S5145.resourceKey=src/main/java/**/*
sonar.issue.ignore.multicriteria.S5145.ruleKey=javasecurity:S5145
# Rule https://rules.sonarsource.com/java/RSPEC-1176 is ignored to keep self-explanatory public API names concise.
sonar.issue.ignore.multicriteria.UndocumentedApi.resourceKey=src/main/java/**/*
sonar.issue.ignore.multicriteria.UndocumentedApi.ruleKey=squid:UndocumentedApi
# These password-named locale strings are labels and validation guidance, not credentials.
sonar.issue.ignore.multicriteria.LocalizedPasswordLabels.resourceKey=src/main/shared/src/web-locales/**/*.json
sonar.issue.ignore.multicriteria.LocalizedPasswordLabels.ruleKey=json:S2068
