sonar.test.inclusions=src/test/**/*.java,src/main/web/**/*.test.ts,src/main/web/**/*.test.tsx,src/main/web/e2e/**/*.ts,src/main/desktop/test/**/*.test.mjs,src/main/desktop/e2e/**/*.test.mjs,src/main/mobile/src/**/*.test.ts,src/main/mobile/src/**/*.test.mjs,src/main/mobile/src/**/*.coverage.test.tsx,src/main/mobile/src/testing/**/*.ts,src/main/mobile/e2e/**/*.test.mjs,mcp/src/test/**/*.java
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports,mcp/target/surefire-reports,mcp/target/failsafe-reports
