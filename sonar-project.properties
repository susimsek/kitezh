sonar.tests=src/test/java,src/main/web,src/main/desktop/test,src/main/desktop/e2e,src/main/mobile/src,src/main/mobile/e2e,mcp/src/test/java
sonar.organization=susimsek
sonar.host.url=https://sonarcloud.io
