sonar.exclusions=src/main/web/node_modules/**,src/main/web/.next/**,src/main/web/out/**,src/main/desktop/node_modules/**,src/main/desktop/dist/**,src/main/desktop/renderer/**,src/main/desktop/release/**,src/main/mobile/node_modules/**,**/coverage/**
