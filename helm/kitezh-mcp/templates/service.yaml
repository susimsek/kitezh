apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitezh-mcp.fullname" . }}
  labels:
    {{ include "kitezh-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
  selector:
    {{ include "kitezh-mcp.selectorLabels" . | nindent 4 }}
