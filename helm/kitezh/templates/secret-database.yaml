{{- if not .Values.existingSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitezh.databaseSecretName" . }}
  labels:
    {{ include "kitezh.labels" . | nindent 4 }}
type: Opaque
data:
  database-username: {{ .Values.spring.datasource.username | b64enc | quote }}
  database-password: {{ .Values.spring.datasource.password | b64enc | quote }}
{{- end }}
