apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitezh.fullname" . }}
  labels:
    {{ include "kitezh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.management.port }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{ include "kitezh.selectorLabels" . | nindent 4 }}
