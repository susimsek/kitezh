apiVersion: v1
kind: Service
metadata:
  name: {{ include "spring-authorization-server-samples.fullname" . }}
  labels:
    {{ include "spring-authorization-server-samples.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.management.port }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{ include "spring-authorization-server-samples.selectorLabels" . | nindent 4 }}
