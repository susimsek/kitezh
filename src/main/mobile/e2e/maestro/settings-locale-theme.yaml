appId: io.github.susimsek.kitezh.mobile
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Kitezh logo"
    timeout: 180000
- tapOn: "Settings|Ayarlar"
- assertVisible: "Settings|Ayarlar"
- tapOn:
    id: settings-locale-system
- assertVisible:
    id: settings-locale-system
    selected: true
- tapOn:
    id: settings-locale-english
- assertVisible: "Settings"
- tapOn:
    id: settings-locale-turkish
- assertVisible: "Ayarlar"
- assertVisible: "Görünüm"
- tapOn:
    id: settings-theme-system
- assertVisible:
    id: settings-theme-system
    selected: true
- tapOn:
    id: settings-theme-dark
- assertVisible: "Koyu"
- tapOn:
    id: settings-theme-light
- assertVisible: "Açık"
