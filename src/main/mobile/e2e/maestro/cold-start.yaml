appId: io.github.susimsek.kitezh.mobile
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Kitezh logo"
    timeout: 180000
- assertVisible: "Kitezh"
- runFlow:
    when:
      visible: "Continue|Devam et"
    commands:
      - assertVisible: "Continue|Devam et"
      - tapOn: "Continue|Devam et"
      - assertVisible: "Sign in|Giriş yap"
- runFlow:
    when:
      visible: "Account Console"
    commands:
      - assertVisible: "fixture-user"
