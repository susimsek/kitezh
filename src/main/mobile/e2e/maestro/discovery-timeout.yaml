appId: io.github.susimsek.kitezh.mobile
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Continue|Devam et"
    timeout: 30000
- tapOn: "Continue|Devam et"
- assertVisible: "Sign in|Giriş yap"
- extendedWaitUntil:
    visible: "Checking the secure sign-in service timed out|Güvenli giriş hizmeti kontrolü zaman aşımına uğradı"
    timeout: 30000
- tapOn: "Retry|Tekrar dene"
- extendedWaitUntil:
    notVisible: "Checking the secure sign-in service timed out|Güvenli giriş hizmeti kontrolü zaman aşımına uğradı"
    timeout: 30000
- tapOn: "Sign in|Giriş yap"
- tapOn:
    text: "Use without an account"
    optional: true
- assertVisible: "Continue with fixture account"
- back
