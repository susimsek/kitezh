appId: io.github.susimsek.kitezh.mobile
---
- stopApp
- launchApp:
    clearState: false
- assertVisible: "Kitezh logo"
- runFlow:
    when:
      visible: "Continue|Devam et"
    commands:
      - tapOn:
          id: landing-settings
      - tapOn:
          id: settings-locale-english
      - tapOn: "Back|Geri"
      - tapOn: "Continue|Devam et"
      - tapOn: "Sign in|Giriş yap"
      # iOS may ask once to allow the app to use the local fixture domain for sign-in.
      - tapOn:
          text: "^Continue$"
          optional: true
      - tapOn:
          text: "Stay signed out"
          optional: true
      - tapOn: "Continue with fixture account|Test hesabıyla devam et"
- extendedWaitUntil:
    visible: "Account Console|Hesap Konsolu"
    timeout: 180000
- tapOn:
    id: account-tab-account
- extendedWaitUntil:
    visible: "fixture-user"
    timeout: 180000
- scrollUntilVisible:
    element:
      text: "Additional profile information"
    direction: DOWN
- assertVisible: "Additional profile information"
- assertNotVisible: "Additional profile information could not be loaded. Try again."
- scrollUntilVisible:
    element:
      id: profile-attribute-department
    direction: DOWN
- assertVisible: "Engineering"
- tapOn:
    id: profile-attribute-department
- eraseText: 32
- inputText: "Native Platform"
- assertVisible:
    id: profile-attribute-department
    text: "Native Platform"
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
- tapOn: "Save"
- assertVisible:
    id: profile-attribute-department
    text: "Native Platform"
# Restart without clearing SecureStore; the value must be loaded from the fixture API.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Account Console|Hesap Konsolu"
    timeout: 180000
- extendedWaitUntil:
    visible: "fixture-user"
    timeout: 180000
- scrollUntilVisible:
    element:
      text: "Department"
    direction: DOWN
- assertVisible:
    id: profile-attribute-department
    text: "Native Platform"
- assertNotVisible: "Additional profile information could not be loaded. Try again."
