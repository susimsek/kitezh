<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kitezh</title>
    <style>
      :root {
        color-scheme: light;
        --admin-sidebar-width: 264px;
        --admin-content-max-width: 1600px;
        --admin-nav-height: 40px;
        --admin-control-height: var(--control-compact);
        --admin-control-radius: var(--radius-control);
        /* SHARED_LIGHT_THEME_TOKENS */
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        /* SHARED_DARK_THEME_TOKENS */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        overflow-wrap: anywhere;
        background: var(--background);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        margin-right: 0;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app {
        display: grid;
        grid-template-columns: var(--admin-sidebar-width) minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px 12px 12px;
        background: var(--surface);
        border-right: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 12px 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        font-size: 18px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 800;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
      }
      .brand-mark .brand-dark,
      :root[data-theme="dark"] .brand-mark .brand-light {
        display: none;
      }
      :root[data-theme="dark"] .brand-mark .brand-dark {
        display: block;
      }
      .console-label {
        margin: 0 12px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .nav {
        display: grid;
        gap: 4px;
        flex: 1 0 auto;
      }
      .nav button,
      .secondary-button {
        min-height: var(--admin-nav-height);
        padding: 8px 11px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text-muted);
        text-align: left;
        font-size: 13px;
        font-weight: 500;
      }
      .nav button:hover {
        background: var(--surface-muted);
        color: var(--text);
      }
      .nav button[aria-current="page"] {
        background: color-mix(in srgb, var(--primary) 11%, var(--surface));
        border-color: transparent;
        color: var(--primary);
        font-weight: 650;
      }
      .sidebar-footer {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .main {
        min-width: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 30px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 96%, transparent);
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .admin-event-total-badge {
        display: inline-flex;
        align-items: center;
        margin-left: 10px;
        padding: 3px 10px;
        color: var(--on-primary);
        border-radius: 999px;
        background: var(--text-muted);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0;
        vertical-align: middle;
      }
      .topbar p {
        margin: 3px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }
      .topbar.is-user-detail {
        min-height: 54px;
        justify-content: flex-end;
      }
      .content {
        max-width: var(--admin-content-max-width);
        margin: 0 auto;
        padding: 28px 30px 40px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .stat-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .dashboard-layout {
        display: grid;
        gap: 18px;
      }
      .stat-card {
        display: grid;
        min-height: 142px;
        grid-template-columns: 1fr auto;
        align-content: space-between;
        gap: 18px 12px;
      }
      .stat-card h2 {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 550;
      }
      .admin-stat-icon {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 11px;
        background: color-mix(in srgb, var(--primary) 10%, var(--surface));
        color: var(--primary);
        font-size: 18px;
      }
      .stat-value {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      .stat-action {
        grid-column: 1 / -1;
      }
      .stat-action > button,
      .dashboard-panel > button,
      .dashboard-events-heading > button {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        font-size: 12px;
      }
      .stat-action > button:hover,
      .dashboard-panel > button:hover,
      .dashboard-events-heading > button:hover {
        border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
        background: var(--surface-muted);
      }
      .dashboard-panels {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .dashboard-panel h2,
      .dashboard-events-heading h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
      }
      .dashboard-panel h2 > span,
      .dashboard-events-heading h2 > span {
        color: var(--primary);
      }
      .health-row {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .health-badge,
      .key-algorithm {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--surface-muted);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 650;
      }
      .health-badge.is-up {
        background: color-mix(in srgb, #198754 12%, var(--surface));
        color: #198754;
      }
      .health-badge.is-down {
        background: color-mix(in srgb, #dc3545 12%, var(--surface));
        color: #dc3545;
      }
      .issuer-value,
      .signing-key-id {
        overflow-wrap: anywhere;
        margin: 16px 0;
        color: var(--text-muted);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 12px;
      }
      .signing-key-id {
        color: var(--text);
        font-weight: 600;
      }
      .empty-value {
        margin: 16px 0;
        color: var(--text-muted);
      }
      .dashboard-events {
        padding: 0;
        overflow: hidden;
      }
      .dashboard-events-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dashboard-events-heading h2 {
        margin: 0 0 4px;
      }
      .dashboard-events-heading p {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
      }
      .dashboard-event-list {
        display: grid;
      }
      .dashboard-event {
        display: grid;
        grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dashboard-event:last-child {
        border-bottom: 0;
      }
      .event-action {
        overflow: hidden;
        color: var(--text-muted);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event-summary {
        display: grid;
        min-width: 0;
        grid-template-columns: auto 1fr;
        gap: 3px 8px;
        font-size: 12px;
      }
      .event-summary > span,
      .event-summary > small,
      .dashboard-event time {
        overflow: hidden;
        color: var(--text-muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event-summary > small {
        grid-column: 1 / -1;
        font-size: 11px;
      }
      .dashboard-event time {
        font-size: 11px;
      }
      .card {
        min-width: 0;
        padding: 20px;
        background: var(--surface);
        border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
        border-radius: 12px;
        box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 4%, transparent);
      }
      .card h2,
      .card h3 {
        margin: 0 0 7px;
        font-size: 16px;
        font-weight: 650;
      }
      .card > p {
        margin: 0 0 16px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .server-info-layout {
        display: grid;
        gap: 16px;
      }
      .server-info-card h2 {
        margin-bottom: 16px;
      }
      .server-info-runtime {
        display: grid;
        grid-template-columns: minmax(140px, 24%) minmax(0, 1fr);
        gap: 12px 16px;
        margin: 0;
      }
      .server-info-runtime dt {
        color: var(--text-muted);
        font-weight: 600;
      }
      .server-info-runtime dd {
        min-width: 0;
        margin: 0;
      }
      .server-info-key {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .server-info-key code,
      .server-info-table code {
        overflow-wrap: anywhere;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .server-info-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--surface-muted);
        font-size: 12px;
        font-weight: 650;
      }
      .server-info-badge.is-success {
        color: var(--success-text, #fff);
        background: var(--success, #198754);
      }
      .server-info-table-wrap {
        overflow-x: auto;
      }
      .server-info-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      .server-info-table th,
      .server-info-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .server-info-table thead th {
        color: var(--text-muted);
        background: var(--surface-muted);
        font-size: 12px;
        font-weight: 650;
        text-transform: uppercase;
      }
      .server-info-table tbody tr:last-child th,
      .server-info-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .server-info-table tbody th {
        white-space: nowrap;
      }
      .server-info-table td:nth-child(2) {
        overflow-wrap: anywhere;
      }
      .server-info-table td:last-child {
        width: 1%;
        text-align: right;
        white-space: nowrap;
      }
      .server-info-tabs {
        display: flex;
        gap: 4px;
        margin: -4px 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .server-info-tabs button {
        padding: 9px 13px;
        color: var(--text-muted);
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }
      .server-info-tabs button.is-active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 650;
      }
      .server-info-json-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .server-info-json-heading > span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .server-info-json {
        max-height: 420px;
        overflow: auto;
        margin: 0;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-muted);
        font-family: var(--font-mono);
        font-size: 12px;
        white-space: pre;
      }
      .form-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .field {
        display: grid;
        gap: 5px;
        min-width: 0;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: var(--admin-control-height);
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: var(--admin-control-radius);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
      }
      textarea {
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      textarea.secret-pem {
        -webkit-text-security: disc;
      }
      input[aria-invalid="true"],
      select[aria-invalid="true"],
      textarea[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .field-error {
        min-height: 18px;
        color: var(--danger);
        font-size: 12px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 16px;
      }
      .primary-button,
      .info-button,
      .warning-button,
      .success-button,
      .danger-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: var(--admin-control-height);
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: var(--admin-control-radius);
        color: var(--on-primary);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
        text-align: center;
        white-space: normal;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }
      .button-icon {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        line-height: 1;
      }
      .button-icon svg {
        display: block;
        width: 16px;
        height: 16px;
      }
      .primary-button {
        background: var(--primary);
      }
      .primary-button:hover {
        background: var(--primary-pressed);
      }
      .info-button {
        background: #0dcaf0;
        color: #071d25;
      }
      .info-button:hover {
        background: #31d2f2;
      }
      .warning-button {
        background: #ffc107;
        color: #302400;
      }
      .warning-button:hover {
        background: #ffcd39;
      }
      .success-button {
        background: #198754;
        color: #fff;
      }
      .success-button:hover {
        background: #157347;
      }
      .danger-button {
        background: var(--danger);
        color: var(--on-danger);
      }
      .secondary-button {
        min-height: var(--admin-control-height);
        padding: var(--space-small) var(--space-medium);
        border: 1px solid var(--border);
        border-radius: var(--admin-control-radius);
        font-size: 13px;
        font-weight: 600;
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .secondary-button:hover {
        background: var(--surface-muted);
      }
      .notice {
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-muted);
        font-size: 13px;
      }
      .notice.error {
        border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
        color: var(--danger);
      }
      .notice.success {
        border-color: color-mix(in srgb, var(--success) 55%, var(--border));
        color: var(--success);
      }
      .notice.warning {
        border-color: var(--warning);
      }
      .list {
        display: grid;
        gap: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .list-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 14px;
        border-bottom: 1px solid
          color-mix(in srgb, var(--border) 75%, transparent);
      }
      .list-item:last-child {
        border-bottom: 0;
      }
      .list-item:hover {
        background: color-mix(in srgb, var(--surface-muted) 45%, transparent);
      }
      .list-item strong,
      .list-item span {
        display: block;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .admin-users-panel {
        overflow: visible;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
      }
      .admin-users-toolbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(180px, 240px) minmax(
            160px,
            240px
          );
        gap: 10px;
        align-items: center;
        padding: 20px;
      }
      .admin-users-search {
        display: flex;
        min-width: 0;
        height: 46px;
        align-items: center;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface);
        color: var(--text-muted);
      }
      .admin-users-search > span {
        display: grid;
        width: 46px;
        height: 100%;
        flex: 0 0 46px;
        place-items: center;
        border-right: 1px solid var(--border);
        font-size: 22px;
      }
      .admin-users-search input {
        min-width: 0;
        height: 100%;
        flex: 1;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .admin-users-filter,
      .admin-users-filter select {
        width: 100%;
        min-width: 0;
      }
      .admin-users-filter select {
        height: 46px;
        border-radius: 11px;
      }
      .admin-users-count {
        padding: 0 20px 20px;
        color: var(--text-muted);
        font-size: 14px;
      }
      .admin-users-table-wrap {
        width: 100%;
        overflow: visible;
        border-top: 1px solid var(--border);
      }
      .admin-users-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .admin-users-table th {
        height: 54px;
        padding: 0 14px;
        background: var(--surface-muted);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        text-align: left;
        text-transform: uppercase;
      }
      .admin-users-table td {
        height: 80px;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        vertical-align: middle;
      }
      .admin-users-table .admin-user-select {
        width: 64px;
        padding: 0;
        text-align: center;
        vertical-align: middle;
      }
      .admin-users-table .admin-user-select input {
        display: block;
        width: 18px;
        height: 18px;
        margin: 0 auto;
      }
      .admin-users-table th:nth-child(2) {
        width: 40%;
      }
      .admin-users-table th:nth-child(3) {
        width: 30%;
      }
      .admin-users-table th:nth-child(4) {
        width: auto;
      }
      .admin-users-table th:last-child {
        width: 56px;
      }
      .admin-user-identity {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
      }
      .admin-users-table td.admin-user-identity-cell {
        padding-left: 21px;
      }
      .admin-user-avatar-small {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        place-items: center;
        overflow: hidden;
        border-radius: 50%;
        background: var(--surface-muted);
        color: var(--text-muted);
        font-weight: 700;
      }
      .admin-user-avatar-small img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .admin-user-name {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 10px;
      }
      .admin-user-name strong {
        overflow: hidden;
        color: var(--primary);
        font-size: 15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .admin-user-detail-link {
        max-width: 100%;
        overflow: hidden;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--primary);
