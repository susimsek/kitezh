<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kitezh</title>
    <style>
      :root {
        color-scheme: light;
        --admin-sidebar-width: 264px;
        --admin-content-max-width: 1600px;
        --admin-nav-height: 40px;
        --admin-control-height: 40px;
        --admin-control-radius: 9px;
        /* SHARED_LIGHT_THEME_TOKENS */
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        /* SHARED_DARK_THEME_TOKENS */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--focus) 25%, transparent);
        outline-offset: 1px;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app {
        display: grid;
        grid-template-columns: var(--admin-sidebar-width) minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px 12px 12px;
        background: var(--surface);
        border-right: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 12px 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        font-size: 18px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 800;
      }
      .console-label {
        margin: 0 12px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .nav {
        display: grid;
        gap: 4px;
        flex: 1 0 auto;
      }
      .nav button,
      .secondary-button {
        min-height: var(--admin-nav-height);
        padding: 8px 11px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text-muted);
        text-align: left;
        font-size: 13px;
        font-weight: 500;
      }
      .nav button:hover {
        background: var(--surface-muted);
        color: var(--text);
      }
      .nav button[aria-current="page"] {
        background: color-mix(in srgb, var(--primary) 11%, var(--surface));
        border-color: transparent;
        color: var(--primary);
        font-weight: 650;
      }
      .sidebar-footer {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .main {
        min-width: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 30px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 96%, transparent);
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 3px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }
      .content {
        max-width: var(--admin-content-max-width);
        margin: 0 auto;
        padding: 28px 30px 40px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .stat-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .dashboard-layout {
        display: grid;
        gap: 18px;
      }
      .stat-card {
        display: grid;
        min-height: 142px;
        grid-template-columns: 1fr auto;
        align-content: space-between;
        gap: 18px 12px;
      }
      .stat-card h2 {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 550;
      }
      .admin-stat-icon {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 11px;
        background: color-mix(in srgb, var(--primary) 10%, var(--surface));
        color: var(--primary);
        font-size: 18px;
      }
      .stat-value {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      .stat-action {
        grid-column: 1 / -1;
      }
      .stat-action > button,
      .dashboard-panel > button,
      .dashboard-events-heading > button {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        font-size: 12px;
      }
      .stat-action > button:hover,
      .dashboard-panel > button:hover,
      .dashboard-events-heading > button:hover {
        border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
        background: var(--surface-muted);
      }
      .dashboard-panels {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .dashboard-panel h2,
      .dashboard-events-heading h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
      }
      .dashboard-panel h2 > span,
      .dashboard-events-heading h2 > span {
        color: var(--primary);
      }
      .health-row {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .health-badge,
      .key-algorithm {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--surface-muted);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 650;
      }
      .health-badge.is-up {
        background: color-mix(in srgb, #198754 12%, var(--surface));
        color: #198754;
      }
      .health-badge.is-down {
        background: color-mix(in srgb, #dc3545 12%, var(--surface));
        color: #dc3545;
      }
      .issuer-value,
      .signing-key-id {
        overflow-wrap: anywhere;
        margin: 16px 0;
        color: var(--text-muted);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 12px;
      }
      .signing-key-id {
        color: var(--text);
        font-weight: 600;
      }
      .empty-value {
        margin: 16px 0;
        color: var(--text-muted);
      }
      .dashboard-events {
        padding: 0;
        overflow: hidden;
      }
      .dashboard-events-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dashboard-events-heading h2 {
        margin: 0 0 4px;
      }
      .dashboard-events-heading p {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
      }
      .dashboard-event-list {
        display: grid;
      }
      .dashboard-event {
        display: grid;
        grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dashboard-event:last-child {
        border-bottom: 0;
      }
      .event-action {
        overflow: hidden;
        color: var(--text-muted);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event-summary {
        display: grid;
        min-width: 0;
        grid-template-columns: auto 1fr;
        gap: 3px 8px;
        font-size: 12px;
      }
      .event-summary > span,
      .event-summary > small,
      .dashboard-event time {
        overflow: hidden;
        color: var(--text-muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event-summary > small {
        grid-column: 1 / -1;
        font-size: 11px;
      }
      .dashboard-event time {
        font-size: 11px;
      }
      .card {
        min-width: 0;
        padding: 20px;
        background: var(--surface);
        border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
        border-radius: 12px;
        box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 4%, transparent);
      }
      .card h2,
      .card h3 {
        margin: 0 0 7px;
        font-size: 16px;
        font-weight: 650;
      }
      .card > p {
        margin: 0 0 16px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .form-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .field {
        display: grid;
        gap: 5px;
        min-width: 0;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: var(--admin-control-height);
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: var(--admin-control-radius);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
      }
      textarea {
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      textarea.secret-pem {
        -webkit-text-security: disc;
      }
      input[aria-invalid="true"],
      select[aria-invalid="true"],
      textarea[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .field-error {
        min-height: 18px;
        color: var(--danger);
        font-size: 12px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 16px;
      }
      .primary-button,
      .danger-button {
        min-height: var(--admin-control-height);
        padding: 8px 15px;
        border: 1px solid transparent;
        border-radius: var(--admin-control-radius);
        color: var(--on-primary);
        font-size: 13px;
        font-weight: 600;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }
      .button-icon {
        margin-inline-end: 6px;
      }
      .primary-button {
        background: var(--primary);
      }
      .primary-button:hover {
        background: var(--primary-pressed);
      }
      .danger-button {
        background: var(--danger);
        color: var(--on-danger);
      }
      .secondary-button {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .secondary-button:hover {
        background: var(--surface-muted);
      }
      .notice {
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-muted);
        font-size: 13px;
      }
      .notice.error {
        border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
        color: var(--danger);
      }
      .notice.success {
        border-color: color-mix(in srgb, var(--success) 55%, var(--border));
        color: var(--success);
      }
      .notice.warning {
        border-color: var(--warning);
      }
      .list {
        display: grid;
        gap: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .list-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 14px;
        border-bottom: 1px solid
          color-mix(in srgb, var(--border) 75%, transparent);
      }
      .list-item:last-child {
        border-bottom: 0;
      }
      .list-item:hover {
        background: color-mix(in srgb, var(--surface-muted) 45%, transparent);
      }
      .list-item strong,
      .list-item span {
        display: block;
      }
      .muted {
        color: var(--text-muted);
      }
      .empty {
        padding: 24px;
        border: 1px dashed var(--border);
        border-radius: 9px;
        color: var(--text-muted);
        text-align: center;
        font-size: 13px;
      }
      .loading {
        display: grid;
        place-items: center;
        min-height: 240px;
        color: var(--text-muted);
      }
      .login {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 28px;
      }
      .login-card {
        width: min(520px, 100%);
        text-align: center;
      }
      .login-card .actions {
        justify-content: center;
      }
      .login-card button {
        min-width: 230px;
      }
      .settings-row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid
          color-mix(in srgb, var(--border) 75%, transparent);
        font-size: 13px;
      }
      .admin-user-avatar {
        width: 5rem;
        height: 5rem;
        border-radius: 50%;
        object-fit: cover;
      }
      .settings-row:last-child {
        border-bottom: 0;
      }
      dialog {
        max-width: 440px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 45%);
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .nav {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .sidebar-footer {
          grid-template-columns: 1fr 1fr;
        }
        .two-col,
        .form-grid {
          grid-template-columns: 1fr;
        }
        .stat-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dashboard-panels {
          grid-template-columns: 1fr;
        }
        .content {
          padding: 20px;
        }
        .topbar {
          position: static;
          padding: 16px 20px;
        }
      }
      @media (max-width: 520px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .topbar .actions {
          margin-top: 0;
        }
        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .stat-grid {
          grid-template-columns: 1fr 1fr;
        }
        .dashboard-event {
          grid-template-columns: 1fr auto;
          gap: 8px 12px;
          padding: 12px 16px;
        }
        .event-action {
          grid-column: 1 / -1;
        }
        .dashboard-events-heading {
          align-items: flex-start;
          flex-direction: column;
          padding: 16px;
        }
        .card {
          padding: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (forced-colors: active) {
        :root,
        :root[data-theme="dark"] {
          color-scheme: light dark;
          --background: Canvas;
          --surface: Canvas;
          --surface-muted: Canvas;
          --text: CanvasText;
          --text-muted: CanvasText;
          --primary: Highlight;
          --primary-pressed: Highlight;
          --on-primary: HighlightText;
          --danger: LinkText;
          --on-danger: Canvas;
          --success: CanvasText;
          --warning: CanvasText;
          --focus: Highlight;
          --border: CanvasText;
        }
        .primary-button,
        .danger-button,
        .brand-mark {
          border: 1px solid ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app://renderer/native/renderer.mjs"></script>
  </body>
</html>
