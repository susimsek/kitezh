# Dev purpose only. DO NOT use in production.
name: kitezh
services:
  app:
    image: docker.io/suayb/kitezh:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/kitezh
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_LIQUIBASE_ENABLED=false
      - APP_AUTHORIZATIONSERVER_ISSUER=http://127.0.0.1:9090
      - APP_MCP_RESOURCE_AUDIENCE=${KITEZH_MCP_PUBLIC_URL:-http://localhost:10000/mcp}
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgresql:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  mcp-server:
    image: docker.io/suayb/kitezh-mcp:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=10000
      - MANAGEMENT_SERVER_PORT=10001
      - OTEL_SERVICE_NAME=kitezh-mcp
      - KITEZH_SECURITY_ISSUER_URI=http://127.0.0.1:9090
      - KITEZH_SECURITY_JWK_SET_URI=http://app:9090/oauth2/jwks
      - KITEZH_SECURITY_TOKEN_URI=http://app:9090/oauth2/token
      - KITEZH_SECURITY_AUDIENCE=${KITEZH_MCP_PUBLIC_URL:-http://localhost:10000/mcp}
      - KITEZH_API_BASE_URL=http://app:9090
      - KITEZH_MCP_PUBLIC_URL=${KITEZH_MCP_PUBLIC_URL:-http://localhost:10000/mcp}
      - KITEZH_MCP_CLIENT_ID=mcp-server
      - KITEZH_MCP_CLIENT_SECRET=${KITEZH_MCP_CLIENT_SECRET:-}
      - KITEZH_READ_ONLY=true
    ports:
      - "127.0.0.1:10000:10000"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  liquibase:
    image: docker.io/suayb/liquibase-postgresql:5.0.1
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://postgresql:5432/kitezh
      - LIQUIBASE_COMMAND_USERNAME=appuser
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=db/changelog/db.changelog-master.xml
    volumes:
      - ../resources/db:/liquibase/db:ro
    command:
      - update

  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql
