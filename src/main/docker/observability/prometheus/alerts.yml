groups:
  - name: spring-authorization-server-production
    interval: 30s
    rules:
      - alert: SpringAuthorizationServerDown
        expr: up{job=~"spring-authorization-server.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Spring Authorization Server is unavailable
          description: The Prometheus target {{ $labels.instance }} has been down for more than five minutes.
      - alert: SpringAuthorizationServerScrapeMissing
        expr: absent(up{job=~"spring-authorization-server.*"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Spring Authorization Server scrape target is missing
          description: Prometheus has no Spring Authorization Server scrape target for more than five minutes.
      - alert: SpringAuthorizationServerAuthenticationErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{
            job=~"spring-authorization-server.*",
            uri=~"/login|/logout|/oauth2/authorize|/oauth2/token|/oauth2/introspect|/oauth2/revoke",
            outcome="SERVER_ERROR"
          }[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{
            job=~"spring-authorization-server.*",
            uri=~"/login|/logout|/oauth2/authorize|/oauth2/token|/oauth2/introspect|/oauth2/revoke"
          }[5m])), 1) > 0.001
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authentication server-error SLI is above target
          description: Authentication requests are returning server errors above the 0.1 percent SLO for five minutes.
      - alert: SpringAuthorizationServerAuthenticationLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{
              job=~"spring-authorization-server.*",
              uri=~"/login|/logout|/oauth2/authorize|/oauth2/token|/oauth2/introspect|/oauth2/revoke"
            }[5m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Authentication latency SLI is above target
          description: The authentication request p95 latency has exceeded 250 milliseconds for ten minutes.
      - alert: SpringAuthorizationServerHighHeapUsage
        expr: |
          100 * sum(jvm_memory_used_bytes{job=~"spring-authorization-server.*",area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{job=~"spring-authorization-server.*",area="heap"}), 1) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: JVM heap usage is high
          description: JVM heap usage has exceeded 85 percent for ten minutes.
      - alert: SpringAuthorizationServerHikariPoolSaturated
        expr: sum(hikaricp_connections_pending{job=~"spring-authorization-server.*"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database connection pool is saturated
          description: Requests have been waiting for a Hikari connection for five minutes.
