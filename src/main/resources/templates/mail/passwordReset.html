<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{mail.password-reset.subject}">Reset your password</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <p th:text="#{mail.password-reset.greeting(${username})}">Hello,</p>
    <p th:text="#{mail.password-reset.text}">A password reset was requested for your account.</p>
    <p>
      <a th:href="${actionUrl}" th:text="#{mail.password-reset.action}">Reset password</a>
    </p>
    <p th:text="#{mail.common.expiry}">This link is valid for a limited time.</p>
    <p>
      <span th:text="#{mail.common.ignore}">If you did not request this, you can ignore this email.</span>
      <br />
      <span th:text="#{mail.common.regards}">Regards,</span>
      <br />
      <em th:text="#{mail.common.signature}">Kitezh Team</em>
    </p>
  </body>
</html>
