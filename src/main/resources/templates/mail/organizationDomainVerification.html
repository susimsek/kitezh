<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{mail.organization.domain.subject}">Verify organization domain</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <p th:text="#{mail.organization.domain.greeting}">Verify the organization domain.</p>
    <p th:text="#{mail.organization.domain.text(${organizationName})}">Confirm the domain ownership.</p>
    <p><a th:href="${actionUrl}" th:text="#{mail.organization.domain.action}">Verify domain</a></p>
    <p th:text="#{mail.common.expiry}">This link is valid for a limited time.</p>
  </body>
</html>
