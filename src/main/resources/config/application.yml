spring:
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: true
    keep-alive: true
  threads:
    virtual:
      enabled: true
  session:
    timeout: 30m
  h2:
    console:
      enabled: false
  application:
    name: spring-authorization-server-samples
  web:
    locale: en
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  messages:
    basename: i18n/messages
  profiles:
    active: '@spring.profiles.active@'
  docker:
    compose:
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.cache.region.factory_class: jcache
      hibernate.javax.cache.provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
      hibernate.cache.use_second_level_cache: true
      # Dynamic, filtered, and paginated repository queries must not share stale result sets.
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.fetch_size: 50
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  data:
    web:
      pageable:
        max-page-size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false

server:
  port: 9090
  shutdown: graceful

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  session:
    cleanup-cron: "0 * * * * *"
  social-login:
    enabled: ${APP_SOCIAL_LOGIN_ENABLED:false}
    encryption-key: ${SOCIAL_LOGIN_ENCRYPTION_KEY:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    linkedin:
      client-id: ${LINKEDIN_CLIENT_ID:}
      client-secret: ${LINKEDIN_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
  authorization-server:
    issuer: https://spring-authorization-server-samples.local
  dpop:
    nonce-required: ${APP_DPOP_NONCE_REQUIRED:false}
    nonce-ttl: ${APP_DPOP_NONCE_TTL:PT5M}
  web-authn:
    rp-name: Spring Authorization Server Samples
    rp-id: ""
    allowed-origins: ""
    timeout-seconds: 300
    resident-key: REQUIRED
    user-verification: REQUIRED
    attestation: NONE
