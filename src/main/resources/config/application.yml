spring:
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: true
    keep-alive: true
  threads:
    virtual:
      enabled: true
  session:
    timeout: 30m
  h2:
    console:
      enabled: false
  application:
    name: spring-authorization-server-samples
  web:
    locale: en
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    active: '@spring.profiles.active@'
  docker:
    compose:
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.cache.region.factory_class: jcache
      hibernate.javax.cache.provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
      hibernate.cache.use_second_level_cache: true
      # Dynamic, filtered, and paginated repository queries must not share stale result sets.
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.fetch_size: 50
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: VIA_DTO
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false

server:
  port: 9090
  shutdown: graceful

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
      file: ${LOGGING_STRUCTURED_FORMAT_FILE:}
    ecs:
      service:
        name: ${LOGGING_STRUCTURED_ECS_SERVICE_NAME:spring-authorization-server-samples}
        environment: ${LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}

management:
  opentelemetry:
    enabled: ${MANAGEMENT_OPENTELEMETRY_ENABLED:false}
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:spring-authorization-server-samples}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:dev}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:}
          headers:
            Authorization: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_HEADERS_AUTHORIZATION:}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:}
          headers:
            Authorization: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_HEADERS_AUTHORIZATION:}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}
  tracing:
    export:
      enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    exemplars:
      include: ${MANAGEMENT_TRACING_EXEMPLARS_INCLUDE:sampled-traces}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:}
        headers:
          Authorization: ${MANAGEMENT_OTLP_METRICS_EXPORT_HEADERS_AUTHORIZATION:}
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

app:
  desktop:
    renderer-origin: ${APP_DESKTOP_RENDERER_ORIGIN:app://renderer}
  logging:
    file-enabled: ${APP_LOG_FILE_ENABLED:false}
    file-path: ${APP_LOG_FILE_PATH:logs/application.log}
    syslog-enabled: ${APP_LOG_SYSLOG_ENABLED:false}
    syslog-host: ${APP_LOG_SYSLOG_HOST:localhost}
    syslog-port: ${APP_LOG_SYSLOG_PORT:514}
    syslog-facility: ${APP_LOG_SYSLOG_FACILITY:USER}
    syslog-output: ${APP_LOG_SYSLOG_OUTPUT:default}
    syslog-json-format: ${APP_LOG_SYSLOG_JSON_FORMAT:default}
    async-enabled: ${APP_LOG_ASYNC_ENABLED:true}
    async-queue-size: ${APP_LOG_ASYNC_QUEUE_SIZE:512}
    async-never-block: ${APP_LOG_ASYNC_NEVER_BLOCK:false}
    max-body-bytes: ${APP_LOG_MAX_BODY_BYTES:8192}
    obfuscate:
      replacement: ${APP_LOG_OBFUSCATE_REPLACEMENT:***}
      headers: ${APP_LOG_OBFUSCATE_HEADERS:Authorization,Cookie,Set-Cookie,Proxy-Authorization,DPoP,X-Api-Key}
      body-fields: ${APP_LOG_OBFUSCATE_BODY_FIELDS:access_token,refresh_token,id_token,client_secret,password,authorization,cookie,token,secret,api_key,assertion,saml_response,private_key,code,code_verifier,captchaToken,response,siteKey,apiKey,auth_req_id,client_notification_token,id_token_hint,login_hint_token,user_code,dpop,dpop_proof,jwk}
      parameters: ${APP_LOG_OBFUSCATE_PARAMETERS:access_token,refresh_token,id_token,client_secret,client_assertion,password,authorization,token,secret,api_key,assertion,code,code_verifier,state,nonce,request,request_uri,id_token_hint,auth_req_id,client_notification_token,login_hint_token,user_code,captchaToken,response,key}
      cookies: ${APP_LOG_OBFUSCATE_COOKIES:SESSION}
    client:
      enabled: ${APP_LOG_CLIENT_ENABLED:false}
      level: ${APP_LOG_CLIENT_LEVEL:BASIC}
      exclude-paths: ${APP_LOG_CLIENT_EXCLUDE_PATHS:}
    server:
      enabled: ${APP_LOG_SERVER_ENABLED:true}
      level: ${APP_LOG_SERVER_LEVEL:BASIC}
      exclude-paths: ${APP_LOG_SERVER_EXCLUDE_PATHS:/actuator/(health(?:/.*)?|prometheus|metrics(?:/.*)?)}
      file-enabled: ${APP_LOG_SERVER_FILE_ENABLED:false}
      file-path: ${APP_LOG_SERVER_FILE_PATH:logs/application-access.log}
  session:
    cleanup-cron: "0 * * * * *"
  authorization-server:
    issuer: https://spring-authorization-server-samples.local
    offline-session-idle: ${APP_OFFLINE_SESSION_IDLE:P30D}
  dpop:
    nonce-required: ${APP_DPOP_NONCE_REQUIRED:false}
    nonce-ttl: ${APP_DPOP_NONCE_TTL:PT5M}
  web-authn:
    rp-name: Spring Authorization Server Samples
    rp-id: ""
    allowed-origins: ""
    timeout-seconds: 300
    resident-key: REQUIRED
    user-verification: REQUIRED
    attestation: NONE
