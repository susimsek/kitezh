spring:
  web:
    locale: en
  main:
    allow-bean-definition-overriding: true
  cache:
    type: none
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: localhost
    port: 1025

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

app:
  cache:
    caffeine:
      ttl: PT1H
      initial-capacity: 50
      maximum-size: 100
  session:
    cleanup-cron: "0 * * * * *"
  authorization-server:
    issuer: http://127.0.0.1:0
  mail:
    enabled: false
    from: Spring Authorization Server <no-reply@localhost>
    base-url: http://127.0.0.1:0
  security:
    password-policy:
      minimum-length: 12
      maximum-length: 128
      minimum-uppercase: 1
      minimum-lowercase: 1
      minimum-digits: 1
      minimum-special-characters: 1
      reject-username: true
      reject-email: true
      reject-common-passwords: true
      history-size: 5
      expiration-days: 90
      common-passwords: password,123456,12345678,qwerty,qwerty123,admin,letmein
    brute-force:
      enabled: true
      max-failures: 5
      quick-login-window: PT1S
      minimum-quick-login-wait: PT1M
      wait-increment: PT1M
      max-wait: PT15M
      failure-reset-time: PT12H
      max-temporary-lockouts: 3
      permanent-lockout: false
      ip-requests-per-minute: 30
      username-ip-requests-per-minute: 5
