name: Publish GitHub Release

on:
  workflow_run:
    workflows:
      - Backend Release
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-github-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Build packages and publish once
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve the completed backend release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          upstream_run="$(gh api --repo "${GH_REPO}" "repos/${GH_REPO}/actions/runs/${UPSTREAM_RUN_ID}")"
          workflow_name="$(jq -r '.name' <<< "${upstream_run}")"
          event_name="$(jq -r '.event' <<< "${upstream_run}")"
          release_tag="$(jq -r '.head_branch' <<< "${upstream_run}")"
          release_sha="$(jq -r '.head_sha' <<< "${upstream_run}")"
          if [[ "${workflow_name}" != "Backend Release" || "${event_name}" != "push" ]]; then
            echo "Expected a successful Backend Release tag run; received ${workflow_name} (${event_name})." >&2
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v0.1.4; received '${release_tag}'." >&2
            exit 1
          fi
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Backend Release run ${UPSTREAM_RUN_ID} has an invalid commit SHA." >&2
            exit 1
          fi
          {
            echo "release_tag=${release_tag}"
            echo "release_sha=${release_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure the shared release is a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              --verify-tag \
              --draft \
              --title "${RELEASE_TAG}" \
              --generate-notes
          else
            gh release edit "${RELEASE_TAG}" --draft --repo "${GH_REPO}"
          fi

      - name: Record existing package workflow runs
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          runs="$(gh api --repo "${GH_REPO}" "repos/${GH_REPO}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
          existing_ids="$(jq -c '[.workflow_runs[] | select(.name == "Desktop Release" or .name == "Mobile Release") | .id]' <<< "${runs}")"
          echo "existing_ids=${existing_ids}" >> "${GITHUB_OUTPUT}"

      - name: Start desktop and mobile packaging in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run desktop-release.yml --repo "${GH_REPO}" --ref "${RELEASE_TAG}" -f "release_tag=${RELEASE_TAG}"
          gh workflow run mobile-release.yml --repo "${GH_REPO}" --ref "${RELEASE_TAG}" -f "release_tag=${RELEASE_TAG}"

      - name: Wait for both package workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          EXISTING_RUN_IDS: ${{ steps.baseline.outputs.existing_ids }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 6600))
          while (( SECONDS < deadline )); do
            runs="$(gh api --repo "${GH_REPO}" "repos/${GH_REPO}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
            statuses="$(jq -c --arg sha "${RELEASE_SHA}" --argjson existing "${EXISTING_RUN_IDS}" '
              [.workflow_runs[]
                | select((.name == "Desktop Release" or .name == "Mobile Release")
                    and .event == "workflow_dispatch"
                    and .head_sha == $sha
                    and (.id as $run_id | ($existing | index($run_id)) == null))
                | {name, id, status, conclusion}]
            ' <<< "${runs}")"
            desktop="$(jq -r '[.[] | select(.name == "Desktop Release")] | sort_by(.id) | last // empty | .status' <<< "${statuses}")"
            mobile="$(jq -r '[.[] | select(.name == "Mobile Release")] | sort_by(.id) | last // empty | .status' <<< "${statuses}")"
            desktop_result="$(jq -r '[.[] | select(.name == "Desktop Release")] | sort_by(.id) | last // empty | .conclusion' <<< "${statuses}")"
            mobile_result="$(jq -r '[.[] | select(.name == "Mobile Release")] | sort_by(.id) | last // empty | .conclusion' <<< "${statuses}")"
            echo "Desktop Release: ${desktop:-waiting}; Mobile Release: ${mobile:-waiting}"
            if [[ "${desktop}" == "completed" && "${mobile}" == "completed" ]]; then
              if [[ "${desktop_result}" != "success" || "${mobile_result}" != "success" ]]; then
                echo "Package workflows failed (desktop=${desktop_result}, mobile=${mobile_result}); release remains a draft." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for desktop and mobile packages; release remains a draft." >&2
          exit 1

      - name: Confirm all desktop and mobile assets are present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets --jq '.assets | map(.name)')"
          for pattern in '\.AppImage$' '\.deb$' '\.dmg$' '\.exe$' '\.apk$' '\.ipa$'; do
            if ! jq -e --arg pattern "${pattern}" 'any(.[]; test($pattern; "i"))' <<< "${assets}" >/dev/null; then
              echo "Expected release asset matching ${pattern} is missing; keeping ${RELEASE_TAG} as a draft." >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GH_REPO}"
