name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare shared draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v0.1.4; received '${RELEASE_TAG}'." >&2
            exit 1
          fi
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_sha=${RELEASE_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create or preserve the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              --verify-tag \
              --draft \
              --title "${RELEASE_TAG}" \
              --generate-notes
          else
            gh release edit "${RELEASE_TAG}" --draft --repo "${GH_REPO}"
          fi

  backend:
    name: Build backend and Docker image binaries
    needs: prepare-release
    permissions:
      contents: read
    uses: ./.github/workflows/backend-release.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    secrets: inherit

  desktop:
    name: Package desktop
    needs: prepare-release
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    secrets: inherit

  mobile:
    name: Package mobile
    needs: prepare-release
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-release.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    secrets: inherit

  publish-image-architecture:
    name: Publish Docker image (${{ matrix.architecture }})
    needs:
      - prepare-release
      - backend
      - desktop
      - mobile
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runtime_image: scratch
          - architecture: arm64
            runtime_image: gcr.io/distroless/base-debian12:nonroot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: backend-release
    permissions:
      contents: read
    env:
      NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
      NATIVE_RUNTIME_IMAGE: ${{ matrix.runtime_image }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Download native executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-native-${{ matrix.architecture }}
          path: target

      - name: Verify Docker publishing credentials
        run: |
          set -euo pipefail
          test -n "${DOCKERHUB_USERNAME}"
          test -n "${DOCKERHUB_TOKEN}"
          test -s target/native-executable
          chmod +x target/native-executable

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish versioned architecture image
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ./mvnw -B -ntp -Pprod,native -DskipTests \
            -Dskip.frontend=true \
            -Djib-maven-plugin.image="${NATIVE_RUNTIME_IMAGE}" \
            -Djib-maven-plugin.architecture="${NATIVE_ARCHITECTURE}" \
            jib:build \
            -Djib.to.image="docker.io/${DOCKERHUB_USERNAME}/kitezh:${VERSION}-${NATIVE_ARCHITECTURE}" \
            -Djib.to.auth.username="${DOCKERHUB_USERNAME}" \
            -Djib.to.auth.password="${DOCKERHUB_TOKEN}"

  publish-image-manifests:
    name: Publish multi-architecture Docker tags
    needs:
      - prepare-release
      - publish-image-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: backend-release
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create and verify release and latest manifests
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/kitezh"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"

      - name: Update Docker Hub description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          README_PATH="docs/README-dockerhub.md"
          if [[ ! -f "${README_PATH}" ]]; then
            echo "${README_PATH} not found; skipping Docker Hub README update."
            exit 0
          fi

          TOKEN="$(
            jq -n \
              --arg identifier "${DOCKERHUB_USERNAME}" \
              --arg secret "${DOCKERHUB_TOKEN}" \
              '{identifier: $identifier, secret: $secret}' \
            | curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              https://hub.docker.com/v2/auth/token \
            | jq -er '.access_token')"

          jq -n --rawfile readme "${README_PATH}" '{full_description: $readme}' \
            | curl -fsS -X PATCH \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/kitezh"

  deploy-render:
    name: Deploy versioned image to Render
    needs:
      - prepare-release
      - publish-image-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: backend-release
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      RENDER_RELEASE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_RELEASE_DEPLOY_HOOK_URL }}
    steps:
      - name: Skip Render release deploy when hook is not configured
        if: ${{ env.RENDER_RELEASE_DEPLOY_HOOK_URL == '' }}
        run: echo "RENDER_RELEASE_DEPLOY_HOOK_URL is not configured; skipping release deployment."

      - name: Trigger Render release deploy
        if: ${{ env.RENDER_RELEASE_DEPLOY_HOOK_URL != '' }}
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --get \
            --data-urlencode "imgURL=docker.io/${DOCKERHUB_USERNAME}/kitezh:${VERSION}" \
            "${RENDER_RELEASE_DEPLOY_HOOK_URL}"

  publish-github-release:
    name: Validate assets and publish GitHub Release
    needs:
      - prepare-release
      - desktop
      - mobile
      - publish-image-manifests
      - deploy-render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify required desktop and mobile assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets --jq '.assets | map(.name)')"
          for pattern in '\.AppImage$' '\.deb$' '\.dmg$' '\.exe$' '\.apk$' '\.ipa$'; do
            if ! jq -e --arg pattern "${pattern}" 'any(.[]; test($pattern; "i"))' <<< "${assets}" >/dev/null; then
              echo "Required release asset matching ${pattern} is missing; keeping ${RELEASE_TAG} as a draft." >&2
              exit 1
            fi
          done

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GH_REPO}"
