name: Publish GitHub Release

on:
  workflow_run:
    workflows:
      - Desktop Release
      - Mobile Release
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-github-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish after all release assets are ready
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve triggering release run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          upstream_run="$(gh api --repo "${GH_REPO}" "repos/${GH_REPO}/actions/runs/${UPSTREAM_RUN_ID}")"
          release_sha="$(jq -r '.head_sha' <<< "${upstream_run}")"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a valid release commit from workflow run ${UPSTREAM_RUN_ID}." >&2
            exit 1
          fi
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.release_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          release_tag="$(git tag --points-at "${RELEASE_SHA}" --list 'v*' | sort -V | tail -n 1)"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Skipping stale release completion for ${RELEASE_SHA}; no version tag points at this commit."
            echo "current_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "current_release=true" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Confirm backend, desktop, and mobile workflows succeeded
        id: check_release_runs
        if: ${{ steps.release.outputs.current_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          runs="$(gh api --repo "${GH_REPO}" "repos/${GH_REPO}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
          for workflow_name in "Backend Release" "Desktop Release" "Mobile Release"; do
            if ! jq -e --arg sha "${RELEASE_SHA}" --arg name "${workflow_name}" \
              '.workflow_runs | any(.[]; .head_sha == $sha and .name == $name and .status == "completed" and .conclusion == "success")' \
              <<< "${runs}" >/dev/null; then
              echo "${workflow_name} has not succeeded for ${RELEASE_SHA}; leaving the release as a draft."
              echo "ready=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Let only the last completed package workflow publish
        id: publish_gate
        if: ${{ steps.release.outputs.current_release == 'true' && steps.check_release_runs.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          runs="$(gh api --repo "${GH_REPO}" "repos/${GH_REPO}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
          latest_package_run_id="$(jq -r '
            [.workflow_runs[]
              | select((.name == "Desktop Release" or .name == "Mobile Release") and .status == "completed" and .conclusion == "success")]
            | sort_by(.updated_at)
            | last
            | .id // empty
          ' <<< "${runs}")"
          if [[ "${TRIGGER_RUN_ID}" != "${latest_package_run_id}" ]]; then
            echo "A later package workflow completion will publish this release."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_publish=true" >> "${GITHUB_OUTPUT}"

      - name: Confirm expected release assets are present
        if: ${{ steps.release.outputs.current_release == 'true' && steps.check_release_runs.outputs.ready == 'true' && steps.publish_gate.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets --jq '.assets | map(.name)')"
          for pattern in '\.AppImage$' '\.deb$' '\.dmg$' '\.exe$' '\.apk$' '\.ipa$'; do
            if ! jq -e --arg pattern "${pattern}" 'any(.[]; test($pattern; "i"))' <<< "${assets}" >/dev/null; then
              echo "Expected release asset matching ${pattern} is missing; keeping ${RELEASE_TAG} as a draft." >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        if: ${{ steps.release.outputs.current_release == 'true' && steps.check_release_runs.outputs.ready == 'true' && steps.publish_gate.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GH_REPO}"
