name: Desktop Release

on:
  workflow_run:
    workflows:
      - Backend Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package (for example, v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"

jobs:
  package:
    name: Package desktop (${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.event.workflow_run.head_sha }}

      - name: Set desktop release version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.workflow_run.head_branch }}
        run: node src/main/desktop/scripts/set-release-version.mjs

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: |
            src/main/frontend/pnpm-lock.yaml
            src/main/desktop/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        run: pnpm --dir src/main/frontend install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm --dir src/main/desktop install --frozen-lockfile

      - name: Test desktop shell
        run: pnpm --dir src/main/desktop test

      - name: Build desktop package
        run: pnpm --dir src/main/desktop package

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: src/main/desktop/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.event.workflow_run.head_sha }}

      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.workflow_run.head_branch }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No desktop release assets were produced." >&2
            exit 1
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "${RELEASE_TAG}" "${asset}" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload failed for ${asset}; retrying (${attempt}/3)..." >&2
              sleep 10
            done
            if [ "${uploaded}" != true ]; then
              echo "Unable to upload ${asset} after three attempts." >&2
              exit 1
            fi
          done
