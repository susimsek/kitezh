name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package (for example, v0.1.0)
        required: true
        default: v0.1.0
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"

jobs:
  resolve-release:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      current_release: ${{ steps.release.outputs.current_release }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${DISPATCH_TAG}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v0.1.4; received '${release_tag}'." >&2
            exit 1
          fi
          RELEASE_SHA="$(git rev-parse "${release_tag}^{commit}")"
          {
            echo "release_tag=${release_tag}"
            echo "release_sha=${RELEASE_SHA}"
            echo "current_release=true"
          } >> "${GITHUB_OUTPUT}"

  renderer:
    name: Build desktop renderer
    needs: resolve-release
    if: ${{ needs.resolve-release.outputs.current_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/desktop/pnpm-lock.yaml
          install: false

      - name: Install renderer dependencies
        working-directory: src/main/desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop renderer
        working-directory: src/main/desktop
        run: pnpm run build:shared && pnpm run build:native

      - name: Verify desktop renderer output
        run: test -s src/main/desktop/dist/native/native.html

      - name: Upload shared desktop renderer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renderer-${{ needs.resolve-release.outputs.release_tag }}
          path: src/main/desktop/dist/native/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package desktop (${{ matrix.platform }}-${{ matrix.architecture }})
    needs:
      - resolve-release
      - renderer
    if: ${{ needs.resolve-release.outputs.current_release == 'true' }}
    outputs:
      release_tag: ${{ needs.resolve-release.outputs.release_tag }}
      release_sha: ${{ needs.resolve-release.outputs.release_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            deb_architecture: amd64
            runner: ubuntu-latest
          - platform: linux
            architecture: arm64
            deb_architecture: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            architecture: x64-arm64
            runner: macos-latest
          - platform: windows
            architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: desktop-release
    env:
      DESKTOP_RELEASE_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Set desktop release version
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.release_tag }}
        run: node src/main/desktop/scripts/set-release-version.mjs

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/desktop/pnpm-lock.yaml
          install: false

      - name: Require platform release signing credentials
        working-directory: src/main/desktop
        env:
          MAC_CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          LINUX_GPG_PRIVATE_KEY: ${{ matrix.platform == 'linux' && secrets.LINUX_GPG_PRIVATE_KEY || '' }}
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY || '' }}
        run: node scripts/require-release-signing.mjs

      - name: Install desktop dependencies
        working-directory: src/main/desktop
        run: pnpm install --frozen-lockfile

      - name: Download shared desktop renderer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: renderer-${{ needs.resolve-release.outputs.release_tag }}
          path: src/main/desktop/dist/native/

      - name: Prepare update manifest verification key
        shell: bash
        env:
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY || '' }}
        run: node src/main/desktop/scripts/write-update-manifest-public-key.mjs

      - name: Prepare electron-builder cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/electron-builder"
          mkdir -p "${cache_dir}"
          echo "ELECTRON_BUILDER_CACHE=${cache_dir}" >> "${GITHUB_ENV}"

      - name: Cache electron-builder downloads
        id: electron-builder-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ runner.arch }}-

      - name: Report build cache status
        shell: bash
        env:
          ELECTRON_RUNTIME_CACHE_HIT: ${{ steps.electron-runtime-cache.outputs.cache-hit }}
          ELECTRON_BUILDER_CACHE_HIT: ${{ steps.electron-builder-cache.outputs.cache-hit }}
        run: |
          cache_status() {
            if [[ "$1" == "true" ]]; then
              echo 'exact cache hit'
            else
              echo 'no exact hit (cache miss)'
            fi
          }
          {
            echo '### Desktop build cache status'
            echo "- Electron runtime download: $(cache_status "${ELECTRON_RUNTIME_CACHE_HIT}")"
            echo "- Electron Builder tools: $(cache_status "${ELECTRON_BUILDER_CACHE_HIT}")"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare Apple notarization key
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || '' }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"

      - name: Build desktop package
        shell: bash
        working-directory: src/main/desktop
        env:
          CSC_LINK: ${{ (matrix.platform == 'windows' && secrets.WIN_CSC_LINK) || (matrix.platform == 'macos' && secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD) || (matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          pnpm run build:main
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
              pnpm exec electron-builder --publish never --linux AppImage deb
            else
              pnpm exec electron-builder --publish never --linux AppImage deb rpm snap
            fi
            exit 0
          fi

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            pnpm exec electron-builder --publish never
            exit 0
          fi

          # Build separate packages together so latest-mac.yml includes both architectures.
          pnpm exec electron-builder --publish never --mac --x64 --arm64 --config.mac.notarize=true

      - name: Verify macOS signature and notarization
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          app_count=0
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            spctl --assess --type exec --verbose "${app_path}"
            xcrun stapler validate "${app_path}"
            app_count=$((app_count + 1))
          done < <(find src/main/desktop/release -type d -name '*.app' -print0)
          test "${app_count}" -eq 2

      - name: Verify Windows Authenticode signature
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path "src/main/desktop/release" -Filter "*.exe"
          if ($installers.Count -eq 0) { throw "No Windows installer was produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Install Cosign for Linux artifact signing
        if: ${{ matrix.platform == 'linux' }}
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign Linux packages with Sigstore
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            src/main/desktop/release/*.AppImage
            src/main/desktop/release/*.deb
            src/main/desktop/release/*.rpm
            src/main/desktop/release/*.snap
          )
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            bundle="${package}.sigstore.json"
            cosign sign-blob "${package}" --bundle "${bundle}" --yes
            cosign verify-blob "${package}" \
              --bundle "${bundle}" \
              --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-release.yml@refs/(heads/.+|tags/v.+)$" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          done

      - name: Sign update manifests
        shell: bash
        env:
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY || '' }}
        run: node src/main/desktop/scripts/sign-update-manifests.mjs src/main/desktop/release

      - name: Validate Linux package metadata and sign checksums
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || '' }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          deb_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "${deb_path}"
          test -n "$(dpkg-deb -f "${deb_path}" Package)"
          test -n "$(dpkg-deb -f "${deb_path}" Version)"
          test -n "$(dpkg-deb -f "${deb_path}" Architecture)"
          test -n "$(dpkg-deb -f "${deb_path}" Maintainer)"
          expected_deb_arch="${{ matrix.deb_architecture }}"
          actual_deb_arch="$(dpkg-deb -f "${deb_path}" Architecture)"
          test "${actual_deb_arch}" = "${expected_deb_arch}"
          dpkg-deb --info "${deb_path}"
          appimage_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "${appimage_path}"
          test -x "${appimage_path}"
          if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
            (cd src/main/desktop/release && sha256sum -- *.AppImage *.deb > SHA256SUMS)
          else
            rpm_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
            test -n "${rpm_path}"
            rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' "${rpm_path}"
            snap_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.snap' -print -quit)"
            test -n "${snap_path}"
            test -s "${snap_path}"
            (cd src/main/desktop/release && sha256sum -- *.AppImage *.deb *.rpm *.snap > SHA256SUMS)
          fi
          key_file="${RUNNER_TEMP}/desktop-release-signing-key.asc"
          import_log="${RUNNER_TEMP}/desktop-release-signing-import.log"
          passphrase_file="${RUNNER_TEMP}/desktop-release-signing-passphrase"
          trap 'rm -f "${key_file}" "${import_log}" "${passphrase_file}"' EXIT
          umask 077
          printf '%s' "${LINUX_GPG_PRIVATE_KEY}" > "${key_file}"
          if ! gpg --batch --import "${key_file}" > "${import_log}" 2>&1; then
            echo "Linux release signing key import failed." >&2
            exit 1
          fi
          rm -f "${key_file}" "${import_log}"
          gpg_args=(--batch --yes --armor --detach-sign)
          if [[ -n "${LINUX_GPG_PASSPHRASE}" ]]; then
            printf '%s' "${LINUX_GPG_PASSPHRASE}" > "${passphrase_file}"
            gpg_args+=(--pinentry-mode loopback --passphrase-file "${passphrase_file}")
          fi
          if ! gpg "${gpg_args[@]}" --output src/main/desktop/release/SHA256SUMS.asc src/main/desktop/release/SHA256SUMS > "${import_log}" 2>&1; then
            echo "Linux release checksum signing failed." >&2
            exit 1
          fi

      - name: Collect distributable release assets
        run: node src/main/desktop/scripts/collect-release-assets.mjs src/main/desktop/release "${{ runner.temp }}/desktop-release-assets"

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/desktop-release-assets/*
          if-no-files-found: error

  release:
    name: Upload Desktop Assets
    needs:
      - resolve-release
      - package
    if: ${{ needs.resolve-release.outputs.current_release == 'true' && needs.package.result == 'success' }}
    outputs:
      release_tag: ${{ needs.resolve-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/kitezh-${{ needs.resolve-release.outputs.release_tag }}-sbom.spdx.json
          artifact-name: kitezh-sbom
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No desktop release assets were produced." >&2
            exit 1
          fi

          if ! gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            if ! gh release create "${RELEASE_TAG}" \
                --repo "${GH_REPO}" \
                --verify-tag \
                --draft \
                --title "${RELEASE_TAG}" \
                --generate-notes; then
              gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null
            fi
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft

          declare -A allowed_assets=()
          while IFS= read -r -d '' asset; do
            allowed_assets["$(basename "${asset}")"]=1
          done < <(find release-assets -type f -print0)

          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ "${asset_name}" == *.apk || "${asset_name}" == *.ipa ]]; then
              continue
            fi
            if [[ -z "${allowed_assets["${asset_name}"]+present}" ]]; then
              echo "Removing stale release asset: ${asset_name}"
              gh api --method DELETE "repos/${GH_REPO}/releases/assets/${asset_id}"
            fi
          done < <(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" --jq '.assets[] | [.id, .name] | @tsv')

          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "${RELEASE_TAG}" "${asset}" --clobber --repo "${GH_REPO}"; then
                uploaded=true
                break
              fi
              echo "Upload failed for ${asset}; retrying (${attempt}/3)..." >&2
              sleep 10
            done
            if [ "${uploaded}" != true ]; then
              echo "Unable to upload ${asset} after three attempts." >&2
              exit 1
            fi
          done
