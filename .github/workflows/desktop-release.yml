name: Desktop Release

on:
  workflow_run:
    workflows:
      - Backend Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package (for example, v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"

jobs:
  package:
    name: Package desktop (${{ matrix.platform }}-${{ matrix.architecture }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      release_tag: ${{ steps.resolve_release_tag.outputs.release_tag }}
      release_sha: ${{ steps.resolve_release_tag.outputs.release_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            deb_architecture: amd64
            runner: ubuntu-latest
          - platform: linux
            architecture: arm64
            deb_architecture: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            architecture: universal
            runner: macos-latest
          - platform: windows
            architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: desktop-release
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK || '' }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 || '' }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || '' }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || '' }}
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || '' }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE || '' }}
      UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_release_tag
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TAG}" ]]; then
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="$(git tag --points-at "${RELEASE_SHA}" --list 'v*' | head -n 1)"
          fi
          if [[ -z "${release_tag}" ]]; then
            echo "No release tag points at ${RELEASE_SHA}." >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set desktop release version
        env:
          RELEASE_VERSION: ${{ steps.resolve_release_tag.outputs.release_tag }}
        run: node src/main/desktop/scripts/set-release-version.mjs

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: |
            src/main/frontend/pnpm-lock.yaml
            src/main/desktop/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        working-directory: src/main/frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: src/main/desktop
        run: pnpm install --frozen-lockfile

      - name: Prepare platform signing configuration
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            if [[ -n "${MAC_CSC_LINK}" && -n "${MAC_CSC_KEY_PASSWORD}" ]]; then
              {
                echo "CSC_LINK=${MAC_CSC_LINK}"
                echo "CSC_KEY_PASSWORD=${MAC_CSC_KEY_PASSWORD}"
              } >> "${GITHUB_ENV}"
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
            fi
          elif [[ "${{ matrix.platform }}" == "windows" ]]; then
            if [[ -n "${WIN_CSC_LINK}" && -n "${WIN_CSC_KEY_PASSWORD}" ]]; then
              {
                echo "CSC_LINK=${WIN_CSC_LINK}"
                echo "CSC_KEY_PASSWORD=${WIN_CSC_KEY_PASSWORD}"
              } >> "${GITHUB_ENV}"
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
          fi

      - name: Prepare update manifest verification key
        shell: bash
        run: node src/main/desktop/scripts/write-update-manifest-public-key.mjs

      - name: Prepare electron-builder cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/electron-builder"
          mkdir -p "${cache_dir}"
          echo "ELECTRON_BUILDER_CACHE=${cache_dir}" >> "${GITHUB_ENV}"

      - name: Test desktop shell
        working-directory: src/main/desktop
        run: pnpm test

      - name: Run Electron E2E tests
        shell: bash
        working-directory: src/main/desktop
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a pnpm test:e2e
          else
            pnpm test:e2e
          fi

      - name: Prepare Apple notarization key
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          if [[ -z "${APPLE_API_KEY_BASE64}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" ]]; then
            exit 0
          fi
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"

      - name: Build desktop package
        shell: bash
        working-directory: src/main/desktop
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            pnpm run build
            if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
              pnpm exec electron-builder --publish never --linux AppImage deb
            else
              pnpm exec electron-builder --publish never --linux AppImage deb rpm snap
            fi
            exit 0
          fi

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            pnpm package
            exit 0
          fi

          pnpm run build
          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" && -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
            pnpm exec electron-builder --publish never --mac --x64 --config.mac.notarize=true
            pnpm exec electron-builder --publish never --mac --universal --config.mac.notarize=true
          else
            pnpm exec electron-builder --publish never --mac --x64
            pnpm exec electron-builder --publish never --mac --universal
          fi

      - name: Verify macOS signature and notarization
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" || -z "${APPLE_API_KEY}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" ]]; then
            echo "macOS signing and notarization secrets are not configured; keeping this package unsigned."
            exit 0
          fi
          app_path="$(find src/main/desktop/release -type d -name '*.app' -print -quit)"
          test -n "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type exec --verbose "${app_path}"
          xcrun stapler validate "${app_path}"

      - name: Verify Windows Authenticode signature
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            Write-Host "Windows signing secret is not configured; keeping this package unsigned."
            exit 0
          }
          $installers = Get-ChildItem -Path "src/main/desktop/release" -Filter "*.exe"
          if ($installers.Count -eq 0) { throw "No Windows installer was produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Install Cosign for Linux artifact signing
        if: ${{ matrix.platform == 'linux' }}
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign Linux packages with Sigstore
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            src/main/desktop/release/*.AppImage
            src/main/desktop/release/*.deb
            src/main/desktop/release/*.rpm
            src/main/desktop/release/*.snap
          )
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            bundle="${package}.sigstore.json"
            cosign sign-blob "${package}" --bundle "${bundle}" --yes
            cosign verify-blob "${package}" \
              --bundle "${bundle}" \
              --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-release.yml@refs/(heads/.+|tags/v.+)$" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          done

      - name: Sign update manifests
        shell: bash
        run: node src/main/desktop/scripts/sign-update-manifests.mjs src/main/desktop/release

      - name: Validate Linux package metadata and sign checksums
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "${deb_path}"
          test -n "$(dpkg-deb -f "${deb_path}" Package)"
          test -n "$(dpkg-deb -f "${deb_path}" Version)"
          test -n "$(dpkg-deb -f "${deb_path}" Architecture)"
          test -n "$(dpkg-deb -f "${deb_path}" Maintainer)"
          expected_deb_arch="${{ matrix.deb_architecture }}"
          actual_deb_arch="$(dpkg-deb -f "${deb_path}" Architecture)"
          test "${actual_deb_arch}" = "${expected_deb_arch}"
          dpkg-deb --info "${deb_path}"
          appimage_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "${appimage_path}"
          test -x "${appimage_path}"
          if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
            (cd src/main/desktop/release && sha256sum -- *.AppImage *.deb > SHA256SUMS)
          else
            rpm_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
            test -n "${rpm_path}"
            rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' "${rpm_path}"
            snap_path="$(find src/main/desktop/release -maxdepth 1 -type f -name '*.snap' -print -quit)"
            test -n "${snap_path}"
            test -s "${snap_path}"
            (cd src/main/desktop/release && sha256sum -- *.AppImage *.deb *.rpm *.snap > SHA256SUMS)
          fi
          if [[ -z "${LINUX_GPG_PRIVATE_KEY}" ]]; then
            echo "Linux GPG signing key is not configured; publishing unsigned packages with SHA256SUMS."
            exit 0
          fi
          printf '%s' "${LINUX_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg_args=(--batch --yes --armor --detach-sign)
          if [[ -n "${LINUX_GPG_PASSPHRASE}" ]]; then
            gpg_args+=(--pinentry-mode loopback --passphrase "${LINUX_GPG_PASSPHRASE}")
          fi
          gpg "${gpg_args[@]}" --output src/main/desktop/release/SHA256SUMS.asc src/main/desktop/release/SHA256SUMS

      - name: Collect distributable release assets
        run: node src/main/desktop/scripts/collect-release-assets.mjs src/main/desktop/release "${{ runner.temp }}/desktop-release-assets"

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/desktop-release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: ${{ needs.package.result == 'success' }}
    outputs:
      release_tag: ${{ needs.package.outputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.package.outputs.release_sha }}

      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/kitezh-${{ needs.package.outputs.release_tag }}-sbom.spdx.json
          artifact-name: kitezh-sbom
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No desktop release assets were produced." >&2
            exit 1
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

          declare -A allowed_assets=()
          while IFS= read -r -d '' asset; do
            allowed_assets["$(basename "${asset}")"]=1
          done < <(find release-assets -type f -print0)

          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ -z "${allowed_assets["${asset_name}"]+present}" ]]; then
              echo "Removing stale release asset: ${asset_name}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[] | [.id, .name] | @tsv')

          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "${RELEASE_TAG}" "${asset}" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload failed for ${asset}; retrying (${attempt}/3)..." >&2
              sleep 10
            done
            if [ "${uploaded}" != true ]; then
              echo "Unable to upload ${asset} after three attempts." >&2
              exit 1
            fi
          done
