name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  infrastructure-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Validate Docker Compose definitions
        run: |
          docker compose -f src/main/docker/services.yml config --quiet
          docker compose -f src/main/docker/postgresql.yml config --quiet
          docker compose -f src/main/docker/openldap.yml config --quiet
          docker compose -f src/main/docker/app.yml config --quiet
          docker compose -f src/main/docker/observability.yml config --quiet
          docker compose -f src/main/docker/sonar.yml config --quiet

      - name: Validate Helm chart
        run: |
          diff -qr src/main/resources/db helm/spring-authorization-server-samples/db
          helm lint helm/spring-authorization-server-samples
          helm template spring-authorization-server-samples helm/spring-authorization-server-samples >/dev/null

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/frontend/pnpm-lock.yaml
          install: false

      - name: Print tool versions
        run: |
          java -version
          node --version
          pnpm --version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install Maven dependencies
        run: ./mvnw -B -ntp -Pprod -Dskip.frontend=true dependency:go-offline

      - name: Install frontend dependencies
        run: pnpm --dir src/main/frontend install --frozen-lockfile

      - name: Set up Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Verify Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk --version

      - name: Run Snyk test
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk test --all-projects

      - name: Run Snyk monitor
        if: ${{ github.ref == 'refs/heads/main' && env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk monitor --all-projects

      - name: Backend verification
        run: ./mvnw -B -ntp verify -Dskip.frontend=true

      - name: Frontend type check
        run: pnpm --dir src/main/frontend typecheck

      - name: Frontend lint
        run: pnpm --dir src/main/frontend lint

      - name: Frontend format check
        run: pnpm --dir src/main/frontend format:check

      - name: Frontend build
        run: pnpm --dir src/main/frontend build

      - name: Analyze code with SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          ./mvnw -B -ntp -Psonar initialize sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=susimsek \
            -Dsonar.token="${SONAR_TOKEN}"

  native-image:
    name: Native image (${{ matrix.architecture }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
      NATIVE_TAG: latest-native-${{ matrix.architecture }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"
          native-image-musl: "true"

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/frontend/pnpm-lock.yaml
          install: false

      - name: Print tool versions
        run: |
          java -version
          node --version
          pnpm --version
          native-image --version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install Maven dependencies
        run: ./mvnw -B -ntp -Pprod -Dskip.frontend=true dependency:go-offline

      - name: Install frontend dependencies
        run: pnpm --dir src/main/frontend install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm --dir src/main/frontend build

      - name: Install UPX
        run: |
          UPX_VERSION=5.1.0
          UPX_ARCHIVE="upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"
          tar -xJf "${UPX_ARCHIVE}"
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux/upx" "${RUNNER_TEMP}/bin/upx"
          chmod +x "${RUNNER_TEMP}/bin/upx"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          rm -rf "${UPX_ARCHIVE}" "upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux"
          upx --version

      - name: Build GraalVM native executable
        env:
          # Spring AOT evaluates conditional OTLP auto-configurations at build time.
          # Keep the exporters in the native image; Render supplies the endpoints
          # and credentials at runtime.
          MANAGEMENT_OPENTELEMETRY_ENABLED: "true"
          MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
          MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
          MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "true"
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
        run: |
          ./mvnw -B -ntp -Pprod,native -DskipTests \
            -Dskip.frontend=true \
            -Dspotless.skip=true \
            -Dcheckstyle.skip=true \
            -DbuildArgs="--no-fallback,-Os,--static,--libc=musl,-J-Xmx10g" \
            native:compile

      - name: Compress native executable
        run: upx --lzma --best target/native-executable

      - name: Publish architecture image
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          ./mvnw -ntp -Pprod,native -DskipTests \
            -Dskip.frontend=true \
            -Djib-maven-plugin.architecture="${NATIVE_ARCHITECTURE}" \
            jib:build \
            -Djib.to.image="docker.io/${DOCKERHUB_USERNAME}/spring-authorization-server-samples:${NATIVE_TAG}" \
            -Djib.to.auth.username="${DOCKERHUB_USERNAME}" \
            -Djib.to.auth.password="${DOCKERHUB_TOKEN}" # NOSONAR - value is supplied by a GitHub Actions secret

  publish-native-manifest:
    name: Publish native multi-arch manifest
    needs: native-image
    if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create and verify multi-arch manifest
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/spring-authorization-server-samples"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest-native" \
            "${IMAGE}:latest-native-amd64" \
            "${IMAGE}:latest-native-arm64"
          docker buildx imagetools inspect "${IMAGE}:latest-native"

      - name: Update Docker Hub description
        run: |
          README_PATH="docs/README-dockerhub.md"
          if [ ! -f "${README_PATH}" ]; then
            echo "${README_PATH} not found; skipping Docker Hub README update."
            exit 0
          fi

          TOKEN="$({
            jq -n \
              --arg identifier "${DOCKERHUB_USERNAME}" \
              --arg secret "${DOCKERHUB_TOKEN}" \
              '{identifier: $identifier, secret: $secret}'
          } | curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            https://hub.docker.com/v2/auth/token | jq -er '.access_token')"

          jq -n --rawfile readme "${README_PATH}" '{full_description: $readme}' \
            | curl -fsS -X PATCH \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/spring-authorization-server-samples"

  deploy-render:
    name: Deploy to Render
    needs:
      - infrastructure-validation
      - build
      - publish-native-manifest
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Skip Render deploy when hook is not configured
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment."

      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --get \
            --data-urlencode "imgURL=docker.io/${DOCKERHUB_USERNAME}/spring-authorization-server-samples:latest-native" \
            "${RENDER_DEPLOY_HOOK_URL}"
