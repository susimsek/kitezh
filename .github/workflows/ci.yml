name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  infrastructure-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Validate Docker Compose definitions
        run: |
          docker compose -f src/main/docker/services.yml config --quiet
          docker compose -f src/main/docker/postgresql.yml config --quiet
          docker compose -f src/main/docker/openldap.yml config --quiet
          docker compose -f src/main/docker/app.yml config --quiet
          docker compose -f src/main/docker/observability.yml config --quiet
          docker compose -f src/main/docker/sonar.yml config --quiet

      - name: Validate Helm chart
        run: |
          diff -qr src/main/resources/db helm/kitezh/db
          helm lint helm/kitezh
          helm template kitezh helm/kitezh >/dev/null

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/web/pnpm-lock.yaml
          install: false

      - name: Print tool versions
        run: |
          java -version
          node --version
          pnpm --version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install Maven dependencies
        run: ./mvnw -B -ntp -Pprod -Dskip.frontend=true dependency:go-offline

      - name: Install web dependencies
        run: pnpm --dir src/main/web install --frozen-lockfile

      - name: Set up Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Verify Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk --version

      - name: Run Snyk test
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk test --all-projects

      - name: Run Snyk monitor
        if: ${{ github.ref == 'refs/heads/main' && env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk monitor --all-projects

      - name: Backend verification
        run: ./mvnw -B -ntp verify -Dskip.frontend=true

      - name: Web type check
        run: pnpm --dir src/main/web typecheck

      - name: Web lint
        run: pnpm --dir src/main/web lint

      - name: Web format check
        run: pnpm --dir src/main/web format:check

      - name: Web build
        run: pnpm --dir src/main/web build

      - name: Test web client and collect Sonar coverage
        env:
          SONAR_COVERAGE_REPORT: "true"
        run: pnpm --dir src/main/web test:unit:sonar-coverage

      - name: Upload backend Sonar inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sonar-inputs
          path: |
            target/classes/**
            target/test-classes/**
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/**
            target/checkstyle-result.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload web Sonar coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-sonar-coverage
          path: src/main/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  desktop-quality:
    name: Desktop quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/desktop/pnpm-lock.yaml
          install: false

      - name: Install desktop dependencies
        working-directory: src/main/desktop
        run: pnpm install --frozen-lockfile

      - name: Test desktop shell and collect Sonar coverage
        working-directory: src/main/desktop
        run: pnpm run test:unit:coverage

      - name: Upload desktop Sonar coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-sonar-coverage
          path: src/main/desktop/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  mobile-quality:
    name: Mobile quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/mobile/pnpm-lock.yaml
          install: false

      - name: Install mobile dependencies
        working-directory: src/main/mobile
        run: pnpm install --frozen-lockfile

      - name: Type check mobile client
        working-directory: src/main/mobile
        run: pnpm run typecheck

      - name: Check native dependency boundaries
        working-directory: src/main/mobile
        run: pnpm run check:boundaries

      - name: Check native security boundaries
        working-directory: src/main/mobile
        run: pnpm run check:security

      - name: Check Expo native configuration
        working-directory: src/main/mobile
        run: pnpm run check:expo-config

      - name: Lint mobile client
        working-directory: src/main/mobile
        run: pnpm run lint

      - name: Test mobile client
        working-directory: src/main/mobile
        run: pnpm run test:coverage

      - name: Test native fixture contract
        working-directory: src/main/mobile
        run: pnpm run test:fixture

      - name: Build mobile web export
        working-directory: src/main/mobile
        run: pnpm run build:web

      - name: Upload mobile Sonar coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-sonar-coverage
          path: src/main/mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: SonarCloud analysis
    needs:
      - build
      - desktop-quality
      - mobile-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Download backend Sonar inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-sonar-inputs
          path: target

      - name: Download client coverage reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-sonar-coverage'
          path: sonar-coverage
          merge-multiple: false

      - name: Place client coverage reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/web/coverage src/main/desktop/coverage src/main/mobile/coverage
          cp sonar-coverage/web-sonar-coverage/lcov.info src/main/web/coverage/lcov.info
          cp sonar-coverage/desktop-sonar-coverage/lcov.info src/main/desktop/coverage/lcov.info
          cp sonar-coverage/mobile-sonar-coverage/lcov.info src/main/mobile/coverage/lcov.info

      - name: Analyze backend and client code with SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B -ntp -Psonar initialize sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=susimsek \
            -Dsonar.token="${SONAR_TOKEN}"

  desktop-e2e:
    name: Desktop E2E (${{ matrix.platform }})
    needs: desktop-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: |
            src/main/web/pnpm-lock.yaml
            src/main/desktop/pnpm-lock.yaml
          install: false

      - name: Install web dependencies
        working-directory: src/main/web
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: src/main/desktop
        run: pnpm install --frozen-lockfile

      - name: Run Electron E2E tests
        shell: bash
        working-directory: src/main/desktop
        env:
          KITEZH_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-e2e
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a pnpm test:e2e
          else
            pnpm test:e2e
          fi

      - name: Upload Desktop E2E screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-e2e/*.png
          if-no-files-found: ignore
          retention-days: 7

  mobile-native-e2e:
    name: Mobile native E2E
    needs: mobile-quality
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/mobile-native-e2e.yml
    with:
      source-ref: ${{ github.sha }}

  native-image:
    name: Native image verification (${{ matrix.architecture }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            native_image_musl: "true"
            native_image_args: "--no-fallback,-Os,--static,--libc=musl,-J-Xmx10g"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            # GraalVM CE Linux AArch64 does not ship the musl-linked static JDK
            # libraries, so use a mostly-static glibc image for this leg.
            native_image_musl: "false"
            native_image_args: "--no-fallback,-Os,--static-nolibc,-J-Xmx10g"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
      NATIVE_IMAGE_ARGS: ${{ matrix.native_image_args }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"
          native-image-musl: ${{ matrix.native_image_musl }}

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/web/pnpm-lock.yaml
          install: false

      - name: Print tool versions
        run: |
          java -version
          node --version
          pnpm --version
          native-image --version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install Maven dependencies
        run: ./mvnw -B -ntp -Pprod -Dskip.frontend=true dependency:go-offline

      - name: Install web dependencies
        run: pnpm --dir src/main/web install --frozen-lockfile

      - name: Build web assets
        run: pnpm --dir src/main/web build

      - name: Install UPX
        run: |
          UPX_VERSION=5.1.0
          UPX_ARCHIVE="upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"
          tar -xJf "${UPX_ARCHIVE}"
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux/upx" "${RUNNER_TEMP}/bin/upx"
          chmod +x "${RUNNER_TEMP}/bin/upx"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          rm -rf "${UPX_ARCHIVE}" "upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux"
          upx --version

      - name: Build GraalVM native executable
        env:
          # Spring AOT evaluates conditional OTLP auto-configurations at build time.
          # Keep the exporters in the native image; Render supplies the endpoints
          # and credentials at runtime.
          MANAGEMENT_OPENTELEMETRY_ENABLED: "true"
          MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
          MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
          MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "true"
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
        run: |
          ./mvnw -B -ntp -Pprod,native -DskipTests \
            -Dskip.frontend=true \
            -Dspotless.skip=true \
            -Dcheckstyle.skip=true \
            -DbuildArgs="${NATIVE_IMAGE_ARGS}" \
            native:compile

      - name: Compress native executable
        run: upx --lzma --best target/native-executable
