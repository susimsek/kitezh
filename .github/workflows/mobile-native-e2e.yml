name: Mobile Native E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-e2e
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"
  MAESTRO_VERSION: "2.11.0"

jobs:
  android:
    name: Android native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/mobile/pnpm-lock.yaml
          install: false

      - name: Install mobile dependencies
        working-directory: src/main/mobile
        run: pnpm install --frozen-lockfile

      - name: Run Android Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            maestro_dir="${RUNNER_TEMP}/maestro"
            mkdir -p "${maestro_dir}"
            curl --proto '=https' --tlsv1.2 -fsSLo "${RUNNER_TEMP}/maestro.zip" \
              "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
            unzip -q "${RUNNER_TEMP}/maestro.zip" -d "${maestro_dir}"
            export PATH="${maestro_dir}/maestro/bin:${PATH}"
            cd src/main/mobile
            node e2e/fixture-server.mjs --host 0.0.0.0 --port 8081 > "${RUNNER_TEMP}/mobile-fixture.log" 2>&1 &
            fixture_pid=$!
            export EXPO_PUBLIC_AUTHORIZATION_SERVER_ISSUER="http://10.0.2.2:8081"
            pnpm exec expo start --localhost > "${RUNNER_TEMP}/mobile-metro.log" 2>&1 &
            metro_pid=$!
            trap 'kill "${metro_pid}" "${fixture_pid}" 2>/dev/null || true' EXIT
            fixture_ready=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1:8081/health; then
                fixture_ready=true
                break
              fi
              sleep 1
            done
            test "${fixture_ready}" = true
            CI=1 pnpm exec expo prebuild --platform android
            sleep 10
            pnpm exec expo run:android --no-bundler
            maestro test e2e/maestro

  ios:
    name: iOS native smoke
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/mobile/pnpm-lock.yaml
          install: false

      - name: Install mobile dependencies
        working-directory: src/main/mobile
        run: pnpm install --frozen-lockfile

      - name: Run iOS Maestro flows
        shell: bash
        run: |
          set -euo pipefail
          maestro_dir="${RUNNER_TEMP}/maestro"
          mkdir -p "${maestro_dir}"
          curl --proto '=https' --tlsv1.2 -fsSLo "${RUNNER_TEMP}/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q "${RUNNER_TEMP}/maestro.zip" -d "${maestro_dir}"
          export PATH="${maestro_dir}/maestro/bin:${PATH}"
          cd src/main/mobile
          node e2e/fixture-server.mjs --host 0.0.0.0 --port 8081 > "${RUNNER_TEMP}/mobile-fixture.log" 2>&1 &
          fixture_pid=$!
          export EXPO_PUBLIC_AUTHORIZATION_SERVER_ISSUER="http://127.0.0.1:8081"
          pnpm exec expo start --localhost > "${RUNNER_TEMP}/mobile-metro.log" 2>&1 &
          metro_pid=$!
          trap 'kill "${metro_pid}" "${fixture_pid}" 2>/dev/null || true' EXIT
          fixture_ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              fixture_ready=true
              break
            fi
            sleep 1
          done
          test "${fixture_ready}" = true
          CI=1 pnpm exec expo prebuild --platform ios
          sleep 10
          pnpm exec expo run:ios --simulator --no-bundler
          maestro test e2e/maestro
