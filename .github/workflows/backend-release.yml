name: Backend Release Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: Version tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.22.0"

jobs:
  web-build:
    name: Build release web assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: src/main/web/pnpm-lock.yaml
          install: false

      - name: Install web dependencies
        working-directory: src/main/web
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        working-directory: src/main/web
        run: pnpm build

      - name: Upload web assets for backend native builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web-assets
          path: src/main/web/out/
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify backend release commit
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download web assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-web-assets
          path: src/main/web/out

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw -B -ntp verify -Dskip.frontend=true

  native-image:
    name: Build backend image binary (${{ matrix.architecture }})
    needs:
      - web-build
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            native_image_musl: "true"
            native_image_args: "--no-fallback,-Os,--static,--libc=musl,-J-Xmx10g"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            native_image_musl: "false"
            native_image_args: "--no-fallback,-Os,--static-nolibc,-J-Xmx10g"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
      NATIVE_IMAGE_ARGS: ${{ matrix.native_image_args }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download web assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-web-assets
          path: src/main/web/out

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"
          native-image-musl: ${{ matrix.native_image_musl }}

      - name: Install UPX
        run: |
          set -euo pipefail
          UPX_VERSION=5.1.0
          UPX_ARCHIVE="upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"
          tar -xJf "${UPX_ARCHIVE}"
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "upx-${UPX_VERSION}-${NATIVE_ARCHITECTURE}_linux/upx" "${RUNNER_TEMP}/bin/upx"
          chmod +x "${RUNNER_TEMP}/bin/upx"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          upx --version

      - name: Build GraalVM native executable
        env:
          MANAGEMENT_OPENTELEMETRY_ENABLED: "true"
          MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
          MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
          MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "true"
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
        run: |
          ./mvnw -B -ntp -Pprod,native -DskipTests \
            -Dskip.frontend=true \
            -Dspotless.skip=true \
            -Dcheckstyle.skip=true \
            -DbuildArgs="${NATIVE_IMAGE_ARGS}" \
            native:compile

      - name: Compress native executable
        run: upx --lzma --best target/native-executable

      - name: Upload native executable for gated Docker publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-native-${{ matrix.architecture }}
          path: target/native-executable
          if-no-files-found: error
          retention-days: 1
